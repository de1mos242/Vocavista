app = "vocavista"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVER_FORWARD_HEADERS_STRATEGY = "framework"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
