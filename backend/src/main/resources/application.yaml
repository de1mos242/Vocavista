spring:
  application:
    name: vocavista-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    openai:
      api-key: __missing__
    retry:
      max-attempts: 2
  datasource:
    url: jdbc:postgresql://localhost:5432/vocavista
    username: vocavista
    password: vocavista
    hikari:
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 60000
      validation-timeout: 3000
      connection-timeout: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Vocavista
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:__missing__}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:__missing__}
            scope: openid,email,profile
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Vocavista
    description: Backend service for Vocavista
    version: @project.version@

vocavista:
  admin:
    emails: ${VOCAVISTA_ADMIN_EMAILS:de1m0s242@gmail.com}
  media:
    veo:
      api-key: ${GOOGLE_AI_API_KEY:__missing__}
      model: veo-3.1-lite-generate-preview
      aspect-ratio: "9:16"
      resolution: 720p
      duration-seconds: 6
      poll-interval: 5s
      timeout: 8m
    imagen:
      api-key: ${GOOGLE_AI_API_KEY:__missing__}
      model: imagen-4.0-generate-001
      aspect-ratio: "16:9"
      sample-image-size: 1K
      sample-count: 3
