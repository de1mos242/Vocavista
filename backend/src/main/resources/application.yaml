spring:
  application:
    name: vocavista-backend
  profiles:
    active: local
  ai:
    openai:
      api-key: __missing__
    retry:
      max-attempts: 2
  datasource:
    url: jdbc:postgresql://localhost:5432/vocavista
    username: vocavista
    password: vocavista
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:__missing__}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:__missing__}
            scope: openid,email,profile
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Vocavista Backend
    description: Backend service for Vocavista
    version: @project.version@

vocavista:
  media:
    veo:
      api-key: ${GOOGLE_AI_API_KEY:__missing__}
      model: veo-3.1-lite-generate-preview
      aspect-ratio: "9:16"
      duration-seconds: 6
      poll-interval: 5s
      timeout: 8m
