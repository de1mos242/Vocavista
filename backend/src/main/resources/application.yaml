spring:
  application:
    name: vocavista-backend
  ai:
    openai:
      api-key: ${VOCAVISTA_OPENAI_API_KEY:__missing__}
      # base-url: ${VOCAVISTA_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${VOCAVISTA_OPENAI_MODEL:gpt-4o-mini}
    retry:
      max-attempts: 2
  datasource:
    url: ${VOCAVISTA_DB_URL:jdbc:postgresql://localhost:5432/vocavista}
    username: ${VOCAVISTA_DB_USERNAME:vocavista}
    password: ${VOCAVISTA_DB_PASSWORD:vocavista}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

vocavista:
  media:
    provider-mode: ${VOCAVISTA_MEDIA_PROVIDER_MODE:real}
    storage-mode: ${VOCAVISTA_MEDIA_STORAGE_MODE:s3}
    tts-provider: ${VOCAVISTA_TTS_PROVIDER:elevenlabs}
    lipsync-provider: ${VOCAVISTA_LIPSYNC_PROVIDER:fake}
    render-mode: ${VOCAVISTA_MEDIA_RENDER_MODE:talking-head}
    script-template-version: ${VOCAVISTA_PRONUNCIATION_SCRIPT_TEMPLATE_VERSION:v5}
    voice-config: ${VOCAVISTA_TTS_VOICE_CONFIG:default-clear-german}
    avatar-config: ${VOCAVISTA_LIPSYNC_AVATAR_CONFIG:default-talking-head}
    pronunciation-video-command:
      enabled: false
      word: ${VOCAVISTA_PRONUNCIATION_VIDEO_WORD:}
      phrase: ${VOCAVISTA_PRONUNCIATION_VIDEO_PHRASE:}
      language: ${VOCAVISTA_PRONUNCIATION_VIDEO_LANGUAGE:de}
      timeout-seconds: ${VOCAVISTA_PRONUNCIATION_VIDEO_TIMEOUT_SECONDS:120}
      poll-interval-millis: ${VOCAVISTA_PRONUNCIATION_VIDEO_POLL_INTERVAL_MILLIS:500}
    s3:
      endpoint: ${VOCAVISTA_S3_ENDPOINT:http://localhost:9000}
      region: ${VOCAVISTA_S3_REGION:us-east-1}
      bucket: ${VOCAVISTA_S3_BUCKET:vocavista-media}
      access-key: ${VOCAVISTA_S3_ACCESS_KEY:rustfsadmin}
      secret-key: ${VOCAVISTA_S3_SECRET_KEY:rustfsadmin}
      path-style-access: ${VOCAVISTA_S3_PATH_STYLE_ACCESS:true}
      public-base-url: ${VOCAVISTA_S3_PUBLIC_BASE_URL:http://localhost:9000/vocavista-media}
      url-ttl-seconds: ${VOCAVISTA_S3_URL_TTL_SECONDS:3600}
    elevenlabs:
      base-url: ${VOCAVISTA_ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
      api-key: ${VOCAVISTA_ELEVENLABS_API_KEY:__missing__}
      voice-id: ${VOCAVISTA_ELEVENLABS_VOICE_ID:FGY2WhTYpPnrIDTdsKH5}
#      voice-id: ${VOCAVISTA_ELEVENLABS_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
      model-id: ${VOCAVISTA_ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
      output-format: ${VOCAVISTA_ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
      stability: ${VOCAVISTA_ELEVENLABS_STABILITY:0.5}
      similarity-boost: ${VOCAVISTA_ELEVENLABS_SIMILARITY_BOOST:0.75}
      style: ${VOCAVISTA_ELEVENLABS_STYLE:0.0}
      first-word-speed: ${VOCAVISTA_ELEVENLABS_FIRST_WORD_SPEED:0.72}
      second-word-speed: ${VOCAVISTA_ELEVENLABS_SECOND_WORD_SPEED:0.9}
      phrase-speed: ${VOCAVISTA_ELEVENLABS_PHRASE_SPEED:0.86}
      use-speaker-boost: ${VOCAVISTA_ELEVENLABS_USE_SPEAKER_BOOST:true}
    did:
      base-url: ${VOCAVISTA_DID_BASE_URL:https://api.d-id.com}
      api-key: ${VOCAVISTA_DID_API_KEY:__missing__}
      source-url: ${VOCAVISTA_DID_SOURCE_URL:https://create-images-results.d-id.com/DefaultPresenters/Noelle_f/image.png}
      timeout-seconds: ${VOCAVISTA_DID_TIMEOUT_SECONDS:120}
      poll-interval-millis: ${VOCAVISTA_DID_POLL_INTERVAL_MILLIS:1000}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Vocavista Backend
    description: Backend service for Vocavista
    version: @project.version@
