spring:
  application:
    name: vocavista-backend
  ai:
    openai:
      api-key: __missing__
    retry:
      max-attempts: 2
  datasource:
    url: jdbc:postgresql://localhost:5432/vocavista
    username: vocavista
    password: vocavista
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Vocavista Backend
    description: Backend service for Vocavista
    version: @project.version@
