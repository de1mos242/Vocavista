# Copy this file to application-local.yaml and add only local-only values.
# application-local.yaml is gitignored and loaded by the local Spring profile.

spring:
  ai:
    openai:
      api-key: __missing__

vocavista:
  media:
    openai:
      # Override these if a different OpenAI voice/instruction style sounds better.
      voice: coral
      instructions: Speak in lively, warm, expressive German like an encouraging language tutor. Keep pronunciation precise and natural, with real intonation rather than a flat reading. Say the target word slowly and clearly, pause, say it again with friendly confidence, pause, then say the full phrase naturally with conversational energy.
