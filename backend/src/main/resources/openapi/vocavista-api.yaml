openapi: 3.0.3
info:
  title: Vocavista API
  version: 0.0.1
paths:
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Get the authenticated application user
      security:
        - GoogleOAuth: []
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required.
  /api/v1/media/pronunciations:
    post:
      tags:
        - Media
      operationId: createPronunciation
      summary: Queue or reuse pronunciation video generation
      security:
        - GoogleOAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PronunciationRequest'
      responses:
        '202':
          description: Pronunciation video generation was queued or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media/pronunciations/{id}:
    get:
      tags:
        - Media
      operationId: getPronunciation
      summary: Get pronunciation video generation status
      security:
        - GoogleOAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Pronunciation asset identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pronunciation video generation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
        '404':
          description: Pronunciation asset was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/words/info:
    get:
      tags:
        - Words
      operationId: getWordInfo
      summary: Get compact German word information
      security:
        - GoogleOAuth: []
      parameters:
        - name: word
          in: query
          required: true
          description: German word or fixed expression to explain.
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        '200':
          description: Word information generated for the requested word.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordInfoResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: AI provider returned an invalid or unsuccessful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI provider is unavailable or not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/words/suggestions:
    get:
      tags:
        - Words
      operationId: getWordSuggestions
      summary: Search cached words and generated pronunciations for autocomplete
      security:
        - GoogleOAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: Word fragment to search for.
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        '200':
          description: Matching cached words and generated pronunciations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordSuggestionsResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    GoogleOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: Authenticate with Google OpenID Connect.
            email: Read the user's email address.
            profile: Read the user's display name.
  schemas:
    CurrentUserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - provider
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
        provider:
          $ref: '#/components/schemas/OAuthProvider'
    OAuthProvider:
      type: string
      enum:
        - google
    PronunciationRequest:
      type: object
      required:
        - wordInfoId
        - word
        - phrase
        - language
      properties:
        wordInfoId:
          type: string
          format: uuid
        word:
          type: string
          minLength: 1
          maxLength: 80
        phrase:
          type: string
          minLength: 1
          maxLength: 240
        language:
          type: string
          enum:
            - de
    PronunciationResponse:
      type: object
      required:
        - id
        - wordInfoId
        - status
      properties:
        id:
          type: string
          format: uuid
        wordInfoId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PronunciationStatus'
        videoUrl:
          type: string
          format: uri
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    PronunciationStatus:
      type: string
      enum:
        - queued
        - processing
        - completed
        - failed
    WordInfoResponse:
      type: object
      required:
        - normalizedWord
        - id
        - language
        - translations
        - partOfSpeech
        - frequency
        - isCompound
        - compoundParts
        - shortNote
        - examples
      properties:
        id:
          type: string
          format: uuid
        normalizedWord:
          type: string
          minLength: 1
        language:
          type: string
          enum:
            - de
        translations:
          $ref: '#/components/schemas/LanguageTextMap'
        partOfSpeech:
          $ref: '#/components/schemas/PartOfSpeech'
        gender:
          nullable: true
          $ref: '#/components/schemas/Gender'
        article:
          nullable: true
          $ref: '#/components/schemas/GermanArticle'
        plural:
          type: string
          nullable: true
        frequency:
          $ref: '#/components/schemas/WordFrequency'
        isCompound:
          type: boolean
        compoundParts:
          type: array
          items:
            $ref: '#/components/schemas/CompoundPart'
        shortNote:
          $ref: '#/components/schemas/LanguageTextMap'
        examples:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/WordExample'
    WordSuggestionsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WordSuggestion'
    WordSuggestion:
      type: object
      required:
        - word
        - source
      properties:
        word:
          type: string
          minLength: 1
        phrase:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - word_info
            - pronunciation
        wordInfoId:
          type: string
          format: uuid
          nullable: true
        pronunciationId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/PronunciationStatus'
          nullable: true
        videoUrl:
          type: string
          format: uri
          nullable: true
    CompoundPart:
      type: object
      required:
        - word
        - meanings
      properties:
        word:
          type: string
          minLength: 1
        meanings:
          $ref: '#/components/schemas/LanguageTextMap'
    WordExample:
      type: object
      required:
        - sentence
        - translations
      properties:
        sentence:
          type: string
          minLength: 1
        translations:
          $ref: '#/components/schemas/LanguageTextMap'
    LanguageTextMap:
      type: object
      minProperties: 1
      additionalProperties:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
    PartOfSpeech:
      type: string
      enum:
        - noun
        - verb
        - adjective
        - adverb
        - pronoun
        - preposition
        - conjunction
        - interjection
        - phrase
        - other
    WordFrequency:
      type: string
      enum:
        - rare
        - uncommon
        - common
        - very_common
    Gender:
      type: string
      enum:
        - masculine
        - feminine
        - neuter
    GermanArticle:
      type: string
      enum:
        - der
        - die
        - das
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
