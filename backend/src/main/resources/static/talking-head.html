<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocavista TalkingHead Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131a;
      color: #f5f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(93, 95, 239, 0.36), transparent 34rem),
        linear-gradient(145deg, #10131a 0%, #171a23 50%, #0e1117 100%);
    }

    main {
      display: grid;
      grid-template-columns: minmax(18rem, 28rem) minmax(22rem, 1fr);
      gap: 1.25rem;
      max-width: 74rem;
      margin: 0 auto;
      padding: 2rem;
    }

    section {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      background: rgba(18, 22, 31, 0.82);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .panel {
      padding: 1.25rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    p {
      color: #cbd2e1;
      line-height: 1.5;
    }

    label {
      display: grid;
      gap: 0.4rem;
      margin-top: 1rem;
      color: #dfe5f4;
      font-weight: 650;
    }

    input, textarea, select, button {
      font: inherit;
      border-radius: 0.8rem;
    }

    input, textarea, select {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      padding: 0.8rem 0.9rem;
    }

    select option {
      color: #111;
    }

    textarea {
      min-height: 5rem;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      border: 0;
      background: #d7ff64;
      color: #151515;
      padding: 0.9rem 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #f5f7fb;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    button.inline {
      width: auto;
      margin: 0;
      padding: 0.55rem 0.75rem;
      text-align: left;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    #avatar {
      height: min(72vh, 42rem);
      min-height: 28rem;
      background: radial-gradient(circle at center 30%, rgba(215, 255, 100, 0.14), transparent 22rem), #090b10;
    }

    .status {
      min-height: 4.5rem;
      margin-top: 1rem;
      border-radius: 0.8rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.85rem;
      color: #cbd2e1;
      white-space: pre-wrap;
    }

    .suggestions, .word-variants, .word-info {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }

    .suggestion, .variant, .example {
      width: 100%;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
      color: #f5f7fb;
      text-align: left;
      font-weight: 650;
    }

    .suggestion small, .variant small, .example small, .word-card small {
      display: block;
      margin-top: 0.25rem;
      color: #aeb8ca;
      font-weight: 500;
    }

    .word-card {
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.85rem;
      color: #dfe5f4;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        padding: 1rem;
      }

      #avatar {
        height: 28rem;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs",
        "headaudio": "https://cdn.jsdelivr.net/gh/met4citizen/HeadAudio@main/dist/headaudio.min.mjs"
      }
    }
  </script>
</head>
<body>
  <main>
    <section class="panel">
      <h1>TalkingHead pronunciation preview</h1>
      <p>Generates TTS audio on the backend, then animates a browser avatar locally with TalkingHead.</p>

      <label>
        Word
        <input id="word" value="Hausaufgabe" autocomplete="off">
      </label>

      <div id="suggestions" class="suggestions"></div>

      <button id="search-word" class="secondary">Search word</button>

      <div id="word-variants" class="word-variants"></div>

      <div id="word-info" class="word-info"></div>

      <label>
        Phrase
        <textarea id="phrase">Ich mache meine Hausaufgabe nach dem Abendessen.</textarea>
      </label>

      <label>
        Avatar
        <select id="avatar-choice"></select>
      </label>

      <button id="generate">Generate and speak</button>
      <audio id="audio" controls></audio>
      <div id="status" class="status">Loading TalkingHead modules...</div>
    </section>

    <section>
      <div id="avatar"></div>
    </section>
  </main>

  <script type="module">
    import { TalkingHead } from "talkinghead";
    import { HeadAudio } from "headaudio";

    const avatarNode = document.querySelector("#avatar");
    const statusNode = document.querySelector("#status");
    const audioNode = document.querySelector("#audio");
    const generateButton = document.querySelector("#generate");
    const searchWordButton = document.querySelector("#search-word");
    const wordInput = document.querySelector("#word");
    const phraseInput = document.querySelector("#phrase");
    const avatarChoice = document.querySelector("#avatar-choice");
    const suggestionsNode = document.querySelector("#suggestions");
    const wordVariantsNode = document.querySelector("#word-variants");
    const wordInfoNode = document.querySelector("#word-info");

    const avatars = [
      ["brunette textured", "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette-t.glb"],
      ["brunette", "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb"],
      ["AvatarSDK", "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/avatarsdk.glb"],
      ["Avaturn", "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/avaturn.glb"],
      ["MPFB", "https://raw.githubusercontent.com/met4citizen/TalkingHead/main/avatars/mpfb.glb"],
      ["VRoid", "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/vroid.glb"]
    ];

    avatars.forEach(([name, url]) => {
      const option = document.createElement("option");
      option.value = url;
      option.textContent = name;
      avatarChoice.appendChild(option);
    });

    const setStatus = (message) => {
      statusNode.textContent = message;
    };

    const sleep = (millis) => new Promise((resolve) => setTimeout(resolve, millis));

    let head;
    let headAudioReady = false;
    let selectedSuggestion;
    let suggestionTimer;
    let currentWordInfoId;

    async function initAvatar() {
      head = new TalkingHead(avatarNode, {
        lipsyncModules: ["de"],
        lipsyncLang: "de",
        ttsLang: "de-DE",
        cameraView: "head",
        modelFPS: 30,
        mixerGainSpeech: 3,
        avatarSpeakingEyeContact: 0.85,
        avatarSpeakingHeadMove: 0.32
      });

      await loadSelectedAvatar();

      try {
        await head.audioCtx.audioWorklet.addModule("https://cdn.jsdelivr.net/gh/met4citizen/HeadAudio@main/dist/headworklet.min.mjs");
        const headAudio = new HeadAudio(head.audioCtx, {
          parameterData: {
            vadGateActiveDb: -42,
            vadGateInactiveDb: -58
          }
        });
        await headAudio.loadModel("https://cdn.jsdelivr.net/gh/met4citizen/HeadAudio@main/dist/model-en-mixed.bin");
        head.audioSpeechGainNode.connect(headAudio);
        headAudio.onvalue = (key, value) => {
          if (head.mtAvatar?.[key]) {
            Object.assign(head.mtAvatar[key], { newvalue: value, needsUpdate: true });
          }
        };
        head.opt.update = headAudio.update.bind(headAudio);
        headAudioReady = true;
        setStatus("Ready. Submit a word and phrase to generate audio.");
      }
      catch (error) {
        setStatus(`Avatar loaded, but audio-driven lip sync did not initialize. Audio playback will still work.\n${error.message}`);
      }
    }

    async function loadSelectedAvatar() {
      if (!head) {
        return;
      }
      setStatus(`Loading avatar: ${avatarChoice.selectedOptions[0].textContent}...`);
      await head.showAvatar({
        url: avatarChoice.value,
        avatarMood: "neutral",
        lipsyncLang: "de",
        ttsLang: "de-DE"
      });
    }

    avatarChoice.addEventListener("change", () => {
      loadSelectedAvatar()
        .then(() => setStatus("Avatar loaded. Submit a word and phrase to generate audio."))
        .catch((error) => setStatus(`Could not load avatar.\n${error.message}`));
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function describeSuggestion(item) {
      if (item.source === "pronunciation") {
        return `${item.phrase ?? "No phrase"}${item.status ? ` · ${item.status}` : ""}`;
      }
      return "Cached word info";
    }

    async function searchSuggestions() {
      const query = wordInput.value.trim();
      selectedSuggestion = undefined;
      if (query.length < 2) {
        suggestionsNode.replaceChildren();
        return;
      }

      const response = await fetch(`/api/v1/words/suggestions?query=${encodeURIComponent(query)}`);
      if (!response.ok) {
        throw new Error(await response.text());
      }

      const data = await response.json();
      suggestionsNode.replaceChildren();
      data.items.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "suggestion";
        button.innerHTML = `${escapeHtml(item.word)}<small>${escapeHtml(describeSuggestion(item))}</small>`;
        button.addEventListener("click", () => selectSuggestion(item));
        suggestionsNode.appendChild(button);
      });
    }

    function selectSuggestion(item) {
      selectedSuggestion = item;
      currentWordInfoId = item.wordInfoId;
      wordInput.value = item.word;
      if (item.phrase) {
        phraseInput.value = item.phrase;
      }
      suggestionsNode.replaceChildren();
      setStatus(item.audioUrl
        ? "Selected existing completed pronunciation. Generate and speak will reuse it."
        : "Selected existing entry. Search word or generate pronunciation when ready.");
    }

    async function loadWordInfo() {
      const word = wordInput.value.trim();
      if (!word) {
        setStatus("Enter a word first.");
        return;
      }

      searchWordButton.disabled = true;
      wordVariantsNode.replaceChildren();
      wordInfoNode.innerHTML = "";
      try {
        setStatus("Loading word info...");
        const response = await fetch(`/api/v1/words/info?word=${encodeURIComponent(word)}`);
        if (!response.ok) {
          throw new Error(await response.text());
        }
        renderWordInfo(await response.json());
        setStatus("Choose an example phrase, then generate and speak.");
      }
      catch (error) {
        setStatus(error.message);
      }
      finally {
        searchWordButton.disabled = false;
      }
    }

    function renderWordInfo(info) {
      currentWordInfoId = info.id;
      renderWordVariants(info);

      const translations = [
        ...(info.translations?.en ?? []),
        ...(info.translations?.ru ?? [])
      ].join(" · ");
      const note = [
        ...(info.shortNote?.en ?? []),
        ...(info.shortNote?.ru ?? [])
      ].join(" · ");

      wordInfoNode.innerHTML = `
        <div class="word-card">
          <strong>${escapeHtml(info.normalizedWord)}</strong>
          <small>${escapeHtml([info.article, info.partOfSpeech, info.frequency].filter(Boolean).join(" · "))}</small>
          <small>${escapeHtml(translations)}</small>
          <small>${escapeHtml(note)}</small>
        </div>
      `;

      info.examples?.forEach((example) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "example";
        const translation = [
          ...(example.translations?.en ?? []),
          ...(example.translations?.ru ?? [])
        ].join(" · ");
        button.innerHTML = `${escapeHtml(example.sentence)}<small>${escapeHtml(translation)}</small>`;
        button.addEventListener("click", () => {
          wordInput.value = info.normalizedWord;
          phraseInput.value = example.sentence;
          selectedSuggestion = undefined;
          setStatus(`Phrase selected. Audio will use normalized word: ${info.normalizedWord}`);
        });
        wordInfoNode.appendChild(button);
      });
    }

    function renderWordVariants(info) {
      wordVariantsNode.replaceChildren();
      if (!info.normalizedWord) {
        return;
      }

      const button = document.createElement("button");
      button.type = "button";
      button.className = "variant";
      button.innerHTML = `${escapeHtml(info.normalizedWord)}<small>Normalized word from word info</small>`;
      button.addEventListener("click", () => {
        wordInput.value = info.normalizedWord;
        currentWordInfoId = info.id;
        selectedSuggestion = undefined;
        setStatus(`Using normalized word for audio: ${info.normalizedWord}`);
      });
      wordVariantsNode.appendChild(button);
    }

    wordInput.addEventListener("input", () => {
      currentWordInfoId = undefined;
      clearTimeout(suggestionTimer);
      suggestionTimer = setTimeout(() => {
        searchSuggestions().catch((error) => setStatus(error.message));
      }, 250);
    });

    phraseInput.addEventListener("input", () => {
      selectedSuggestion = undefined;
    });

    searchWordButton.addEventListener("click", loadWordInfo);

    async function createAsset() {
      if (!currentWordInfoId) {
        throw new Error("Search word info before generating audio.");
      }

      const response = await fetch("/api/v1/media/pronunciations", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          wordInfoId: currentWordInfoId,
          word: wordInput.value,
          phrase: phraseInput.value,
          language: "de"
        })
      });

      if (!response.ok) {
        throw new Error(await response.text());
      }

      return response.json();
    }

    async function pollAsset(id) {
      for (let attempt = 0; attempt < 120; attempt += 1) {
        const response = await fetch(`/api/v1/media/pronunciations/${id}`);
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const asset = await response.json();
        setStatus(`id=${asset.id}\nstatus=${asset.status}\nrenderMode=${asset.renderMode ?? "unknown"}`);
        if (asset.status === "completed" || asset.status === "failed") {
          return asset;
        }
        await sleep(500);
      }
      throw new Error("Timed out waiting for generation.");
    }

    async function playThroughTalkingHead(audioUrl) {
      audioNode.src = audioUrl;

      if (!head || !headAudioReady) {
        await audioNode.play();
        return;
      }

      const audioResponse = await fetch(audioUrl);
      if (!audioResponse.ok) {
        throw new Error(`Could not fetch audio: HTTP ${audioResponse.status}`);
      }
      const audioBuffer = await head.audioCtx.decodeAudioData(await audioResponse.arrayBuffer());
      if (head.audioCtx.state === "suspended" || head.audioCtx.state === "interrupted") {
        await head.audioCtx.resume();
      }
      head.speakAudio({ audio: audioBuffer }, { isRaw: true });
    }

    generateButton.addEventListener("click", async () => {
      generateButton.disabled = true;
      try {
        if (selectedSuggestion?.audioUrl && selectedSuggestion.word === wordInput.value.trim()
            && selectedSuggestion.phrase === phraseInput.value.trim()) {
          setStatus(`Playing existing generated audio.\nid=${selectedSuggestion.pronunciationId}\naudioUrl=${selectedSuggestion.audioUrl}`);
          await playThroughTalkingHead(selectedSuggestion.audioUrl);
          return;
        }

        setStatus("Queueing generation...");
        const queued = await createAsset();
        const completed = await pollAsset(queued.id);
        if (completed.status === "failed") {
          throw new Error(`${completed.errorCode}: ${completed.errorMessage}`);
        }
        if (!completed.audioUrl) {
          throw new Error("Generation completed without audioUrl.");
        }
        setStatus(`Playing generated audio.\nid=${completed.id}\nrenderMode=${completed.renderMode ?? "unknown"}\naudioUrl=${completed.audioUrl}`);
        await playThroughTalkingHead(completed.audioUrl);
      }
      catch (error) {
        setStatus(error.message);
      }
      finally {
        generateButton.disabled = false;
      }
    });

    initAvatar().catch((error) => setStatus(`Could not load TalkingHead preview.\n${error.message}`));
  </script>
</body>
</html>
