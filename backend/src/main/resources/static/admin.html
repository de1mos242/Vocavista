<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocavista - Admin Users</title>
  <meta name="application-name" content="Vocavista">
  <meta name="apple-mobile-web-app-title" content="Vocavista">
  <meta name="theme-color" content="#090b0f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b0f;
      color: #f7f1e8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 119, 86, 0.34), transparent 24rem),
        radial-gradient(circle at 82% 18%, rgba(126, 87, 255, 0.28), transparent 26rem),
        linear-gradient(135deg, #090b0f 0%, #151017 48%, #07090d 100%);
    }

    nav {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      max-width: 78rem;
      margin: 0 auto;
      padding: 1rem 2rem 0;
      flex-wrap: wrap;
    }

    nav a {
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      background: rgba(12, 14, 20, 0.82);
      color: #ffc48c;
      padding: 0.65rem 0.9rem;
      font-weight: 850;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .nav-auth {
      margin-left: auto;
      display: flex;
      gap: 0.7rem;
      align-items: center;
      color: #d7ccbf;
      font-size: 0.9rem;
    }

    .nav-auth strong {
      color: #fff9f1;
    }

    .nav-auth small, small {
      color: #bdb0a2;
    }

    button, select, .login-button {
      font: inherit;
      border-radius: 0.85rem;
    }

    button, .login-button {
      border: 0;
      background: linear-gradient(135deg, #ff9c6a 0%, #ffd36d 100%);
      color: #1e130b;
      padding: 0.72rem 0.9rem;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
    }

    button.secondary {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.1);
      color: #f7f1e8;
    }

    button:disabled, select:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .login-button {
      display: inline-flex;
      gap: 0.45rem;
      align-items: center;
      justify-content: center;
    }

    .login-button img {
      width: 1.05rem;
      height: 1.05rem;
    }

    main {
      display: grid;
      gap: 1.25rem;
      max-width: 78rem;
      margin: 0 auto;
      padding: 2rem;
    }

    .hero, .user-row, .status {
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 1.4rem;
      background: rgba(12, 14, 20, 0.82);
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.36);
      padding: 1.25rem;
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #ffb58f;
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 6vw, 5rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    p {
      color: #d7ccbf;
      line-height: 1.55;
    }

    .users {
      display: grid;
      gap: 0.75rem;
    }

    .user-row {
      display: grid;
      grid-template-columns: minmax(14rem, 1fr) auto auto;
      gap: 1rem;
      align-items: center;
    }

    .protected {
      border-color: rgba(255, 211, 109, 0.38);
      background: rgba(255, 211, 109, 0.08);
    }

    .badge {
      display: inline-flex;
      width: fit-content;
      margin-top: 0.35rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.3rem 0.55rem;
      color: #ffe4c8;
      font-size: 0.78rem;
      font-weight: 800;
    }

    select {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.07);
      color: #fff9f1;
      padding: 0.72rem 0.9rem;
    }

    @media (max-width: 760px) {
      nav {
        padding: 1rem 1rem 0;
      }

      .nav-auth {
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
      }

      main {
        padding: 1rem;
      }

      .user-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/veo-video.html">Add new word</a>
      <a href="/review.html">Review</a>
      <a href="/admin.html">Admin</a>
    </div>
    <div id="auth" class="nav-auth">Checking sign-in...</div>
  </nav>

  <main>
    <section class="hero">
      <p class="eyebrow">Admin</p>
      <h1>Manage user access.</h1>
      <p>Approve users for app features. Admin-list users are protected and cannot be edited here.</p>
    </section>

    <div id="status" class="status">Checking admin access...</div>
    <section id="users" class="users"></section>
  </main>

  <script type="module">
    const authNode = document.querySelector("#auth");
    const statusNode = document.querySelector("#status");
    const usersNode = document.querySelector("#users");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function setStatus(message) {
      statusNode.textContent = message;
    }

    function renderSignedOut() {
      const loginUrl = `/login/google?redirect=${encodeURIComponent(location.pathname + location.search + location.hash)}`;
      authNode.innerHTML = `<a class="login-button" href="${escapeHtml(loginUrl)}"><img src="/google-g.svg" alt="" aria-hidden="true">Sign in with Google</a>`;
      usersNode.replaceChildren();
      setStatus("Sign in with an admin Google account to manage users.");
    }

    function renderSignedIn(user) {
      authNode.innerHTML = `
        <div><strong>${escapeHtml(user.displayName)}</strong><br><small>${escapeHtml(user.email)} · ${escapeHtml(user.status)}</small></div>
        <button id="logout" type="button" class="secondary">Logout</button>
      `;
      document.querySelector("#logout").addEventListener("click", logoutCurrentUser);
      if (!user.admin) {
        usersNode.replaceChildren();
        setStatus("Admin access is required for this page.");
        return;
      }
      loadUsers().catch((error) => setStatus(error.message));
    }

    async function logoutCurrentUser() {
      const response = await fetch("/logout", { method: "POST" });
      if (response.ok) {
        renderSignedOut();
      }
    }

    async function loadCurrentUser() {
      try {
        const response = await fetch("/api/v1/auth/me");
        if (response.status === 401) {
          renderSignedOut();
          return;
        }
        if (!response.ok) {
          throw new Error(await response.text());
        }
        renderSignedIn(await response.json());
      }
      catch (error) {
        renderSignedOut();
        setStatus(`Could not check sign-in status. ${error.message}`);
      }
    }

    async function apiFetch(url, options) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        renderSignedOut();
      }
      return response;
    }

    async function loadUsers() {
      setStatus("Loading users...");
      const response = await apiFetch("/api/v1/admin/users");
      if (!response.ok) {
        throw new Error(await response.text());
      }
      const data = await response.json();
      renderUsers(data.items ?? []);
      setStatus(`Loaded ${data.items?.length ?? 0} user accounts.`);
    }

    function renderUsers(users) {
      usersNode.replaceChildren();
      users.forEach((user) => usersNode.appendChild(renderUser(user)));
    }

    function renderUser(user) {
      const row = document.createElement("article");
      row.className = `user-row${user.adminListUser ? " protected" : ""}`;
      row.innerHTML = `
        <div>
          <strong>${escapeHtml(user.email)}</strong>
          <small>${escapeHtml(user.displayName)}</small>
          ${user.adminListUser ? '<span class="badge">Admin-list protected</span>' : ''}
        </div>
        <select ${user.adminListUser ? "disabled" : ""} aria-label="User status">
          ${["pending", "active", "deactivated"].map((status) => `<option value="${status}" ${status === user.status ? "selected" : ""}>${status}</option>`).join("")}
        </select>
        <button type="button" ${user.adminListUser ? "disabled" : ""}>Save</button>
      `;
      const select = row.querySelector("select");
      const button = row.querySelector("button");
      button.addEventListener("click", () => updateUserStatus(user.id, select.value, button));
      return row;
    }

    async function updateUserStatus(id, status, button) {
      button.disabled = true;
      try {
        const response = await apiFetch(`/api/v1/admin/users/${encodeURIComponent(id)}/status`, {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ status })
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        await loadUsers();
        setStatus("User status updated.");
      }
      catch (error) {
        setStatus(error.message);
        button.disabled = false;
      }
    }

    loadCurrentUser();
  </script>
</body>
</html>
