spring:
  datasource:
    hikari:
      initialization-fail-timeout: 0
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

management:
  health:
    db:
      enabled: false
