services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vocavista
      POSTGRES_USER: vocavista
      POSTGRES_PASSWORD: vocavista
    ports:
      - "5432:5432"
    volumes:
      - vocavista-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocavista -d vocavista"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vocavista-postgres-data:
